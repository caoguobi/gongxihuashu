<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工具整合面板 - 双拼视图</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* 顶部导航栏 */
        .navbar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
            padding: 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        
        .nav-container {
            max-width: 100%;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }
        
        .logo {
            font-size: 18px;
            font-weight: bold;
            color: #667eea;
            padding: 12px 0;
        }
        
        .view-toggle {
            display: flex;
            gap: 5px;
            background: #f0f2f5;
            padding: 4px;
            border-radius: 8px;
        }
        
        .view-btn {
            padding: 8px 16px;
            border: none;
            background: transparent;
            color: #666;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .view-btn:hover {
            color: #667eea;
        }
        
        .view-btn.active {
            color: #667eea;
            background: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        /* 外部链接按钮 */
        .external-links {
            display: flex;
            gap: 8px;
        }
        
        .external-btn {
            padding: 6px 12px;
            border: 1px solid #667eea;
            background: white;
            color: #667eea;
            font-size: 12px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }
        
        .external-btn:hover {
            background: #667eea;
            color: white;
        }
        
        /* 内容区域 */
        .content {
            flex: 1;
            padding: 15px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        /* 双拼视图 */
        .split-view {
            display: flex;
            gap: 15px;
            height: calc(100vh - 80px);
        }
        
        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }
        
        .panel-header {
            padding: 12px 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .panel-title {
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .panel-icon {
            font-size: 16px;
        }
        
        .panel-link {
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            font-size: 12px;
            padding: 4px 10px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            transition: all 0.3s ease;
        }
.panel-link:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        .panel-content {
            flex: 1;
            position: relative;
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        /* 单视图模式 */
        .single-view {
            display: none;
            height: calc(100vh - 80px);
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }
        
        .single-view.active {
            display: block;
        }
        
        .single-view iframe {
            width: 100%;
            height: 100%;
        }
        
        /* 移动端适配 */
        @media (max-width: 1024px) {
            .split-view {
                flex-direction: column;
                height: auto;
                min-height: calc(100vh - 80px);
            }
            
            .panel {
                min-height: 600px;
            }
        }
        
        @media (max-width: 768px) {
            .nav-container {
                padding: 10px;
            }
            
            .logo {
                font-size: 16px;
            }
            
            .view-btn span {
                display: none;
            }
            
            .external-links {
                display: none;
            }
            
            .content {
                padding: 10px;
            }
            
            .split-view {
                gap: 10px;
                min-height: calc(100vh - 70px);
            }
            
            .panel {
                min-height: 500px;
            }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">🛠 工具整合面板</div>
            <div class="view-toggle">
                <button class="view-btn active" onclick="switchView('split', this)">
                    <span>◫</span> 双拼视图
                </button>
                <button class="view-btn" onclick="switchView('rsrenwu', this)">
                    <span>▣</span> 任务推荐
                </button>
                <button class="view-btn" onclick="switchView('jinji', this)">
                    <span>▣</span> 晋级奖励
                </button>
            </div>
            <div class="external-links">
                <a href="https://abin593505-a11y.github.io/RSrenwutuijian/" target="_blank" class="external-btn">
                    任务推荐 ↗️
                </a>
                <a href="https://abin593505-a11y.github.io/jinjijiangli/" target="_blank" class="external-btn">
                    晋级奖励 ↗️
                </a>
            </div>
        </div>
    </nav>
    
    <!-- 内容区域 -->
    <div class="content">
        <!-- 双拼视图 -->
        <div id="split-view" class="split-view">
            <!-- 左侧面板 - 任务推荐 -->
            <div class="panel">
                <div class="panel-header">
                    <div class="panel-title">
                        <span class="panel-icon">📝</span>
                        任务推荐工具
                    </div>
                    <a href="https://abin593505-a11y.github.io/RSrenwutuijian/" target="_blank" class="panel-link">
                        单独打开 ↗️
                    </a>
                </div>
                <div class="panel-content">
                    <iframe src="https://abin593505-a11y.github.io/RSrenwutuijian/"></iframe>
                </div>
            </div>
            
            <!-- 右侧面板 - 晋级奖励 -->
            <div class="panel">
                <div class="panel-header">
                    <div class="panel-title">
                        <span class="panel-icon">🎉</span>
                        晋级奖励工具
                    </div>
                    <a href="https://abin593505-a11y.github.io/jinjijiangli/" target="_blank" class="panel-link">
                        单独打开 ↗️
                    </a>
                </div>
                <div class="panel-content">
<iframe src="https://abin593505-a11y.github.io/jinjijiangli/"></iframe>
                </div>
            </div>
        </div>
        
        <!-- 单视图 - 任务推荐 -->
        <div id="single-rsrenwu" class="single-view">
            <iframe src="https://abin593505-a11y.github.io/RSrenwutuijian/"></iframe>
        </div>
        
        <!-- 单视图 - 晋级奖励 -->
        <div id="single-jinji" class="single-view">
            <iframe src="https://abin593505-a11y.github.io/jinjijiangli/"></iframe>
        </div>
    </div>
    
    <script>
        function switchView(查看, btn) {
            // 更新按钮状态
            文档.querySelectorAll('.view-btn').forEach(b => b.classList.移除('active'));
            if (btn) btn.classList.add('active');
            
            // 隐藏所有视图
            文档.getElementById('split-view').style.display = 'none';
            文档.getElementById('single-rsrenwu').classList.移除('active');
            文档.getElementById('single-jinji').classList.移除('active');
            
            // 显示对应视图
            if (查看 === 'split') {
                文档.getElementById('split-view').style.display = 'flex';
            } else if (查看 === 'rsrenwu') {
                文档.getElementById('single-rsrenwu').classList.add('active');
            } else if (查看 === 'jinji') {
                文档.getElementById('single-jinji').classList.add('active');
            }
        }
    </script>
</body>
</html>
